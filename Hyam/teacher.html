      <div class="fb"></div>
      <div class="qtools"><button class="btn sm soft again">🔄 إعادة السؤال</button></div></div>`,
    init:(el,s,ctx)=>{
      const fb=$('.fb',el), box=$('.opts',el);
      const pick=i=>{ const b=$$('.opt',el)[i]; if(!b || box.classList.contains('solved') || b.classList.contains('wrong')) return;
        if(i===s.answer){ b.classList.add('correct'); box.classList.add('solved'); celebrate(); FX.claps(b);
          fb.innerHTML=`<span class="good">أحسنتِ! 👏 إجابة صحيحة</span>${s.explain?`<small>💡 ${s.explain}</small>`:''}`; }
        else { b.classList.add('wrong','shake'); setTimeout(()=>b.classList.remove('shake'),500); Sound.wrong();
          fb.innerHTML='<span class="bad">حاولي مرة أخرى 💜</span>'; } };
      $$('.opt',el).forEach(b=>b.onclick=()=>pick(+b.dataset.i));
      $('.again',el).onclick=()=>{ $$('.opt',el).forEach(b=>b.classList.remove('correct','wrong')); box.classList.remove('solved'); fb.innerHTML=''; };
      ctx.keys=k=>{ const n=parseInt(k,10)||'١٢٣٤'.indexOf(k)+1; if(n>=1&&n<=s.options.length){ pick(n-1); return true; } };
    }
  },

  /* ---------- شرح الخطوات خطوة بخطوة ---------- */
  steps:{
    html:s=>`${head(s)}<div class="s-body">
      <div class="mlpipe st">${s.steps.map((x,i)=>`${i?'<span class="marr">⬅</span>':''}<button class="mstep" data-i="${i}"><span class="mk">${i+1}</span><span class="mi">${x.i}</span><span class="mn">${x.t}</span></button>`).join('')}</div>
      <div class="mshow st"></div>
      <div class="mnav st"><button class="btn soft sm mprev">→ السابقة</button><button class="btn amber mnext">الخطوة التالية ⬅</button></div></div>`,
    init:(el,s)=>{
      let cur=0; const show=$('.mshow',el), btns=$$('.mstep',el);
      const go=i=>{ cur=Math.max(0,Math.min(s.steps.length-1,i)); const x=s.steps[cur];
        btns.forEach((b,k)=>{ b.classList.toggle('cur',k===cur); b.classList.toggle('done',k<cur); });
        show.innerHTML=`<div class="mhead">${x.i} الخطوة ${cur+1}: ${x.t}</div>
          <div class="mdetail">
            <div class="mbox" style="--c:var(--p)"><h4>💡 ماذا تعني؟</h4><p>${x.d}</p></div>
            <div class="mbox" style="--c:var(--rose)"><h4>📧 في مثال الرسائل الاحتيالية</h4><p>${x.ex}</p></div>
            <div class="mbox" style="--c:var(--amber)"><h4>🍳 مثل الطبخ</h4><p>${x.a}</p></div>
          </div>`;
        $('.mprev',el).disabled=cur===0;
        $('.mnext',el).textContent=cur===s.steps.length-1?'🎉 أنهينا الخطوات':'الخطوة التالية ⬅';
        Sound.pop(); };
      btns.forEach(b=>b.onclick=()=>go(+b.dataset.i));
      $('.mprev',el).onclick=()=>go(cur-1);
      $('.mnext',el).onclick=()=>{ if(cur===s.steps.length-1) celebrate(); else go(cur+1); };
      go(0);
    }
  },

  /* ---------- ترتيب الخطوات ---------- */
  order:{
    html:s=>`${head(s)}<div class="s-body">
      <div class="pool st"></div>
      <div class="pipe st">${s.steps.map((_,i)=>`<div class="slot"><span class="n">${i+1}</span><span class="muted" style="font-size:44px">؟</span></div>`).join('')}</div>
      <div class="analogy st">👆 اختاري الخطوة الصحيحة التالية من الأعلى</div>
      <div class="qtools"><button class="btn sm soft again">🔄 إعادة</button><button class="btn sm soft sol">👁️ الحل</button></div></div>`,
    init:(el,s)=>{
      const pool=$('.pool',el), slots=$$('.slot',el); let next=0;
      const place=i=>{ const st=s.steps[i]; slots[i].classList.add('fill');
        slots[i].innerHTML=`<span class="n">${i+1}</span><span class="si">${st.i}</span><span class="sn">${st.t}</span><span class="sa">${st.a}</span>`; };
      const reset=()=>{ next=0; pool.innerHTML=shuffle(s.steps.map((x,idx)=>({...x,idx}))).map(x=>`<button class="chipbtn" data-i="${x.idx}">${x.i} ${x.t}</button>`).join('');
        slots.forEach((sl,i)=>{ sl.classList.remove('fill'); sl.innerHTML=`<span class="n">${i+1}</span><span class="muted" style="font-size:44px">؟</span>`; });
        $$('.chipbtn',pool).forEach(b=>b.onclick=()=>{ const i=+b.dataset.i;
          if(i===next){ b.classList.add('used'); place(i); next++; Sound.pop();
            if(next===s.steps.length){ celebrate(); toast('🏆 رائع! رتّبتِ خطوات تعلّم الآلة كاملة'); } }
          else { b.classList.add('shake'); setTimeout(()=>b.classList.remove('shake'),500); Sound.wrong(); } }); };
      $('.again',el).onclick=reset;
      $('.sol',el).onclick=()=>{ s.steps.forEach((_,i)=>place(i)); $$('.chipbtn',pool).forEach(b=>b.classList.add('used')); next=s.steps.length; };
      reset();
    }
  },

  speech:{
    html:s=>`${head(s)}<div class="s-body"><div class="speech">
      <div class="col sr">
        <div class="sr-pipe st">
          <div class="sr-node"><div class="wave"><span></span><span></span><span></span><span></span><span></span></div><b>موجة صوتية</b><small>المدخلات</small></div>
          <div class="farrow">⬅</div>
          <div class="sr-node"><i class="nn">🧠</i><b>شبكة عصبية</b><small>تطابق الأنماط</small></div>
          <div class="farrow">⬅</div>
          <div class="sr-node"><i>📝</i><b>نص مكتوب</b><small>المخرجات</small></div>
        </div>
        <div class="sr-text st">🎙️ اضغطي الميكروفون وقولي: «${s.sample}»</div>
        <div class="row st" style="justify-content:center;flex-wrap:wrap;gap:16px">
          <button class="btn mic">🎙️ تحدّثي</button><button class="btn soft sim">▶ محاكاة</button><button class="btn soft speak">🔊 الحاسب يقرأ</button></div>
      </div>
      <div class="ayn st"><h3>🔮 ماذا تتوقعين؟ كيف يترجم الحاسب كلمة:</h3><div class="w">«${s.word}»</div>
        <div class="meanings">${s.meanings.map(m=>`<div class="rv"><i>${m.i}</i>${m.t}</div>`).join('')}</div>
        <div class="rv mid" style="background:var(--amber-l);border-radius:20px;padding:12px 20px;font-size:28px">${s.lesson}</div>
        <div style="margin-top:auto"><button class="btn amber rvb">اكشفي المعاني ⬅</button></div></div>
    </div></div>`,
    init:(el,s,ctx)=>{
      const out=$('.sr-text',el), wrap=$('.sr',el); let rec=null;
      const set=t=>{ out.textContent=t; };
      const sim=()=>{ wrap.classList.add('listening'); set('...'); let i=0;
        setTimeout(()=>{ const iv=setInterval(()=>{ set(s.sample.slice(0,++i)); if(i>=s.sample.length){ clearInterval(iv); wrap.classList.remove('listening'); Sound.success(); } },140); },1300); };
      $('.sim',el).onclick=sim;
      $('.speak',el).onclick=()=>say(out.textContent.replace(/[🎙️«»]/g,''));
      $('.mic',el).onclick=()=>{
        const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
        if(!SR){ toast('المتصفح لا يدعم التعرّف على الكلام — استخدمي Chrome أو زر «محاكاة»',3500); return; }
        if(rec){ rec.stop(); return; }
        rec=new SR(); rec.lang='ar-SA'; rec.interimResults=true;
        rec.onstart=()=>{ wrap.classList.add('listening'); set('👂 أستمع إليكِ...'); };
        rec.onresult=e=>set([...e.results].map(r=>r[0].transcript).join(''));
        rec.onerror=e=>toast('تعذّر استخدام الميكروفون ('+e.error+') — جرّبي زر «محاكاة»',3500);
        rec.onend=()=>{ wrap.classList.remove('listening'); rec=null; };
        rec.start();
      };
      ctx.onLeave.push(()=>{ rec&&rec.stop(); });
      mountReveal($('.ayn',el), $('.rvb',el));
    }
  },

      const item=$('.ch-item',el), btns=$('.ch-btns',el), start=$('.startC',el), fb=$('.fb',el);

        item.innerHTML=`${msg}<br>نتيجتكِ: ${pts} من ${items.length} ${pts>=items.length*.7?'🏆':'💪'}`; fb.innerHTML='';
        if(pts>=items.length*.7){ celebrate(); clap(); } else Sound.bell(); };
      const showItem=()=>{ item.textContent=items[idx].t; item.style.animation='none'; item.offsetWidth; item.style.animation='rise .35s both'; };
      const tick=()=>{ left--; $('.tl',el).textContent=left; $('.bar i',el).style.width=(left/s.seconds*100)+'%'; if(left<=5&&left>0) Sound.tick(); if(left<=0) end('⏰ انتهى الوقت!'); };
      const answer=ai=>{ if(!on) return; const ok=items[idx].ai===ai;
        if(ok){ pts++; Sound.success(); fb.innerHTML='<span class="good">✔️ صحيح!</span>'; } else { Sound.wrong(); fb.innerHTML=`<span class="bad">✖️ الإجابة: ${items[idx].ai?'ذكاء اصطناعي 🤖':'برنامج عادي ⚙️'}</span>`; }
        $('.pts',el).textContent=pts; idx++; if(idx>=items.length) end('🎉 أنهيتِ كل البطاقات!'); else showItem(); };
      start.onclick=()=>{ items=shuffle(s.items); idx=0; pts=0; left=s.seconds; on=true; $('.pts',el).textContent=0; $('.tl',el).textContent=left; $('.bar i',el).style.width='100%';
        start.style.display='none'; btns.style.display=''; fb.innerHTML=''; showItem(); clearInterval(iv); iv=setInterval(tick,1000); };
      $('.ai',el).onclick=()=>answer(true); $('.norm',el).onclick=()=>answer(false);
      ctx.keys=k=>{ if(!on) return; if(k==='1'||k==='١'){answer(true);return true} if(k==='2'||k==='٢'){answer(false);return true} };
      ctx.onLeave.push(()=>{ if(on){ clearInterval(iv); on=false; btns.style.display='none'; start.style.display=''; start.textContent='🚀 ابدئي التحدي'; item.textContent='جاهزات؟ ⏱️'; } });
    }
  },

  /* ---------- خريطة المراجعة ---------- */
  summary:{
    html:s=>{ const n=s.nodes.length, pos=s.nodes.map((_,i)=>{ const a=-Math.PI/2+i/n*2*Math.PI; return {x:50+36*Math.cos(a), y:48+38*Math.sin(a)}; });

        <svg>${pos.map(p=>`<line x1="50%" y1="48%" x2="${p.x}%" y2="${p.y}%"/>`).join('')}</svg>
        <div class="mcore" style="top:48%">${s.center}</div>
        ${s.nodes.map((nd,i)=>`<div class="mnode peek" style="left:${pos[i].x}%;top:${pos[i].y}%;--c:${nd.c};--d:${i+1}"><h4>${nd.t}</h4><div class="peek-q">👆 من تلخّص؟</div><div class="peek-a">${nd.a}</div></div>`).join('')}
        <div class="picker st"><button class="btn amber pick">🎲 اختيار عشوائي</button><span class="pn">--</span></div>
      </div></div>`; },
    init:el=>{ $('.pick',el).onclick=()=>{ const pn=$('.pn',el); let k=0;

        if(++k>18){ clearInterval(iv); Sound.success(); pn.style.animation='none'; pn.offsetWidth; pn.style.animation='pop .5s both'; } },80); }; }

  exit:{

      <div class="exit">${s.cards.map(c=>`<div class="xcard st" style="background:${c.c}"><div class="xn">${c.n}</div><p>${c.t}</p></div>`).join('')}</div>

      <div class="motto st"><div class="big-emoji float">🤖🇸🇦</div>${s.verse?`<div class="verse">${s.verse}</div>`:''}<h2>${s.motto}</h2><p>${s.thanks}</p>
        <button class="btn amber bigclap" style="font-size:44px;padding:16px 50px">👏 صفّقن لأنفسكنّ</button></div>

/* ==========================================================================
   🎬 محرك التنقل بين الشرائح
   ========================================================================== */
const Deck = {
  els:[], ctx:[], cur:-1,
  build(){
    const root=$('#slides');
    SLIDES.forEach((s,i)=>{
      const t=T[s.type] || { html:()=>`<h2 class="s-title">⚠️ نوع شريحة غير معروف: ${esc(s.type)}</h2>` };
      const el=document.createElement('section'); el.className='slide'; el.dataset.anim=s.anim||'fade';
      el.innerHTML=t.html(s);
      $$('.st',el).forEach((x,k)=>x.style.setProperty('--d',k));
      root.appendChild(el);
      const ctx={onLeave:[], keys:null, s};
      // عناصر «اضغطي لتظهر» العامة
      $$('.peek',el).forEach(p=>{ p.tabIndex=0; const f=()=>{ p.classList.toggle('open'); Sound.pop(); }; p.addEventListener('click',f); p.addEventListener('keydown',e=>{ if(e.key==='Enter') f(); }); });
      t.init && t.init(el, s, ctx);
      if(s.audio){ const au=new Audio(s.audio); au.preload='auto'; ctx.audio=au;
        ctx.onLeave.push(()=>{ au.pause(); au.currentTime=0; }); }
      this.els.push(el); this.ctx.push(ctx);
    });
    const start=parseInt(location.hash.slice(1),10);
    this.go(isNaN(start)?0:start-1, true);
  },
  go(n, first=false){
    n=Math.max(0, Math.min(this.els.length-1, n));
    if(n===this.cur) return;
    const fwd=n>this.cur, old=this.els[this.cur], nu=this.els[n];
    if(old){ this.ctx[this.cur].onLeave.forEach(f=>f()); old.classList.remove('active','enter-fade','enter-zoom','enter-slide','fwd','back');
      old.classList.add('leaving'); setTimeout(()=>old.classList.remove('leaving'),460); }
    if(document.activeElement && document.activeElement!==document.body) document.activeElement.blur();
    nu.classList.remove('leaving'); nu.classList.add('active', 'enter-'+nu.dataset.anim, fwd?'fwd':'back');
    this.cur=n;
    const au=this.ctx[n].audio;
    if(au){ au.currentTime=0; au.play().catch(()=>{   // المتصفح يمنع التشغيل قبل أول تفاعل
      toast('🔊 اضغطي في أي مكان لتشغيل الصوت',3000);
      addEventListener('pointerdown',()=>{ if(this.cur===n) au.play().catch(()=>{}); },{once:true}); }); }
    $('#counter').textContent=`${n+1} / ${this.els.length}`;
    $('#progress').style.width=((n+1)/this.els.length*100)+'%';
    history.replaceState(null,'','#'+(n+1));
    $('#btnPrev').disabled = n===0; $('#btnNext').disabled = n===this.els.length-1;
    this.renderNotes();
    Live.onSlide(n);   // 📡 إبلاغ أجهزة المجموعات بالشريحة الحالية
  },
  next(){ this.go(this.cur+1); },
  prev(){ this.go(this.cur-1); },
  renderNotes(){ const s=SLIDES[this.cur]; $('#notes').innerHTML=`<h4>📝 ملاحظات للمعلمة — الشريحة ${this.cur+1}</h4>${s.notes||'لا توجد ملاحظات لهذه الشريحة.'}`; }
};

/* ---------- لوحة المفاتيح ---------- */
document.addEventListener('keydown', e=>{
  const typing = /^(INPUT|TEXTAREA)$/.test(e.target.tagName);
  if(typing){ if(e.key==='Escape') e.target.blur(); return; }   // لا نتدخل أثناء الكتابة
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const tm=$('#trainModal');
  if(tm && tm.classList.contains('show')){ if(e.key==='Escape') closeTraining(); return; }   // أثناء المختبر: لا تنقّل بين الشرائح
  const vm=$('#vidModal');
  if(vm && vm.classList.contains('show')){   // أثناء عرض الفيديو: لا تنقّل بين الشرائح
    if(e.key==='Escape') closeWelcomeVideo();
    else if(e.key===' '){ e.preventDefault(); const v=$('video',vm); v.paused?v.play():v.pause(); }
    return;
  }
  const k=e.key;
  if(k==='ArrowRight'||k===' '||k==='PageDown'){ e.preventDefault(); Deck.next(); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); Deck.prev(); }
  else if(k==='ArrowUp'||k==='ArrowDown'){ e.preventDefault(); }
  else if(k==='Home'){ e.preventDefault(); Deck.go(0); }
  else if(k==='End'){ e.preventDefault(); Deck.go(Deck.els.length-1); }
  else if(k==='ت'||e.code==='KeyJ'){ e.preventDefault(); clap(); }
  else if(e.code==='KeyF'){ toggleFull(); }
  else if(e.code==='KeyN'){ $('#notes').classList.toggle('show'); }
  else if(k==='ج'||e.code==='KeyP'){ e.preventDefault(); Live.toggle(); }
  else { const c=Deck.ctx[Deck.cur]; if(c && c.keys && c.keys(k)) e.preventDefault(); }
});

/* ---------- 🧠 خلفية «شبكة عصبية» تتحرك بهدوء خلف الشرائح ---------- */
(function neuralBackground(){
  const cv=document.createElement('canvas'); cv.id='neural'; cv.width=1920; cv.height=1080;
  $('#stage').insertBefore(cv, $('#slides'));
  const g=cv.getContext('2d'), N=46, LINK=230;
  const pts=Array.from({length:N},()=>({x:Math.random()*1920, y:Math.random()*1080, vx:(Math.random()-.5)*.35, vy:(Math.random()-.5)*.35, r:1.5+Math.random()*2.5}));
  const still=matchMedia('(prefers-reduced-motion: reduce)').matches; let last=0;
  function frame(t){
    if(!still) requestAnimationFrame(frame);
    if(t-last<33) return; last=t;                       // نحو 30 إطارًا في الثانية لتخفيف الحمل
    g.clearRect(0,0,1920,1080);
    for(const p of pts){ p.x+=p.vx; p.y+=p.vy; if(p.x<0||p.x>1920) p.vx*=-1; if(p.y<0||p.y>1080) p.vy*=-1; }
    for(let i=0;i<N;i++) for(let j=i+1;j<N;j++){ const a=pts[i], b=pts[j], d=Math.hypot(a.x-b.x,a.y-b.y);
      if(d<LINK){ g.strokeStyle=`rgba(103,232,249,${(1-d/LINK)*.35})`; g.lineWidth=1; g.beginPath(); g.moveTo(a.x,a.y); g.lineTo(b.x,b.y); g.stroke(); } }
    for(const p of pts){ g.fillStyle='rgba(167,139,250,.9)'; g.beginPath(); g.arc(p.x,p.y,p.r,0,7); g.fill(); }
  }
  requestAnimationFrame(frame);
})();

/* ---------------- 🏆 نقاط المجموعات ---------------- */
const TEAMS = LESSON.teams;
const scores = TEAMS.map(()=>0);
function addPoints(k,d){ scores[k]=Math.max(0,scores[k]+d); drawScores(k); Live.saveScores(); }
function drawScores(bumpIdx){
  const max=Math.max(...scores);
  $('#scList').innerHTML=TEAMS.map((t,k)=>`<div class="sc-row" style="--c:${t.color}"><span class="crown">${max>0&&scores[k]===max?'👑':''}</span>
    <span class="sc-name">${t.icon} ${t.name}</span><button data-k="${k}" data-d="-1">−</button><span class="sc-pts ${k===bumpIdx?'bump':''}">${scores[k]}</span><button data-k="${k}" data-d="1">＋</button></div>`).join('');
}
$('#scList').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; const d=+b.dataset.d; addPoints(+b.dataset.k,d); d>0?Sound.success():Sound.pop(); });
$('#btnScore').onclick=()=>$('#score').classList.toggle('open');
$('#scClose').onclick=()=>$('#score').classList.remove('open');
$('#scReset').onclick=()=>{ if(confirm('تصفير نقاط جميع المجموعات؟')){ scores.fill(0); drawScores(); Live.saveScores(); } };
$('#scNew').onclick=()=>Live.newSession();
drawScores();

const Live = (() => {
  const body=document.body, esc=LIVE.esc;
  const GRADED=['choice','blanks','order','sort','tf'];
  const save=(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} };
  const load=k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } };
  let want=load('lv-show')!=='0', hide=load('lv-hide')==='1';
  let slide=-1, task=null, answers={}, ideas={}, revealed=false, awarded=false, presence={};
  let subs=[], lastSig={}, primed=false, primeT, timer=null, timerEnded=false, allDone=false;
  const seen=new Set();
  const listen=(r,ev,fn)=>{ r.on(ev,fn); subs.push(()=>r.off(ev,fn)); };
  let on=false; // true بعد دخول المعلمة بالرقم السري الصحيح
  const noLive=()=>LIVE.ok ? showLogin() : alert(LIVE.why==='config'
    ? 'لم يتم ربط Firebase بعد.\nالصقي بيانات مشروعكِ في ملف firebase-config.js'
    : 'تعذّر تحميل Firebase — تأكدي من اتصال الإنترنت.');

  function setOpen(o){ body.classList.toggle('live-on',o); fit(); setTimeout(fit,400); }
  function toggle(force){
    if(!on) return noLive();
    want = typeof force==='boolean' ? force : !body.classList.contains('live-on');
    save('lv-show',want?'1':'0'); setOpen(want); draw();
  }

  /* عند تغيير الشريحة: نُبلغ الأجهزة ونستمع لإجابات الشريحة الجديدة */
  function onSlide(n){
    slide=n; task=LIVE.taskFor(SLIDES[n]);
    subs.forEach(f=>f()); subs=[]; answers={}; ideas={}; revealed=false; awarded=false; lastSig={}; timer=null; allDone=false;
    primed=false; clearTimeout(primeT); primeT=setTimeout(()=>primed=true,1500);
    $('#liveBtn').classList.toggle('has',!!task);
    if(on && body.classList.contains('live-on')!==(want && !!task)) setOpen(want && !!task);
    draw();
    if(!on) return;
    LIVE.ref('live').set({ slide:n, ts:LIVE.ts() });
    if(!task) return;
    listen(LIVE.ref('answers/'+n),'value',s=>{ answers=s.val()||{}; draw(); });
    listen(LIVE.ref('reveal/'+n),'value',s=>{ revealed=!!s.val(); draw(); });
    listen(LIVE.ref('awarded/'+n),'value',s=>{ awarded=!!s.val(); draw(); });
    listen(LIVE.ref('timer/'+n),'value',s=>{ timer=s.val(); timerEnded=!!timer&&LIVE.now()>=timer.end; tick(); });
    if(task.kind==='ideas') listen(LIVE.ref('ideas/'+n),'child_added',s=>{
      const d=s.val()||{}; if(!TEAMS[d.team]||!d.text) return;
      (ideas[d.team]=ideas[d.team]||[]).push(d.text);
      if(!seen.has(s.key)){ seen.add(s.key); const el=Deck.els[n]; el._addIdea&&el._addIdea(d.text,TEAMS[d.team].color); }
      draw();
    });
  }

  /* عرض إجابة مجموعة حسب نوع السؤال (نص الطالبات يُعرض بأمان عبر esc) */
  function ansHTML(v){
    const t=task, norm=LIVE.norm;
    switch(t.kind){
      case 'choice': { const o=t.options[+v]; return o?`${o.icon||''} ${o.t}`:'—'; }
      case 'rate':   { const r=t.items[+v]; return r?`<span class="emo">${r.e}</span>`:'—'; }
      case 'text':   return esc(v).replace(/\n/g,'<br>');
      case 'texts':  return `<ol>${t.items.map((_,i)=>`<li>${v[i]?esc(v[i]):'<span class="n">—</span>'}</li>`).join('')}</ol>`;
      case 'ideas':  return `<div class="lv-chips">${v.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`;
      case 'blanks': return `<div class="lv-chips">${t.words.map((w,i)=>{ const x=v[i]||''; return `<span class="${x&&norm(x)===norm(w)?'y':'n'}">${x?esc(x):'…'}</span>`; }).join('')}</div>`;
      case 'order':  return `<div class="lv-chips">${t.items.map((_,i)=>{ const it=t.items[v[i]]; return it?`<span class="${v[i]===i?'y':'n'}">${i+1}. ${it.icon} ${it.t}</span>`:''; }).join('')}</div>`;
      case 'sort':   return `<div class="lv-chips">${t.items.map((it,i)=>v[i]==null?'':`<span class="${v[i]===it.b?'y':'n'}" title="${esc(LIVE.strip(it.t))}">${i+1} ${v[i]===it.b?'✓':'✗'}</span>`).join('')}</div>`;
      case 'tf':     return `<div class="lv-chips">${t.items.map((it,i)=>v[i]==null?`<span>${i+1}: —</span>`:`<span class="${v[i]===it.a?'y':'n'}">${i+1}: ${v[i]?'✔ صح':'✖ خطأ'}</span>`).join('')}</div>`;
    }
    return esc(JSON.stringify(v));
  }

  /* توزيع الإجابات (للاختيار من متعدد والتقييم) */
  function distHTML(){
    const t=task; let opts;
    if(t.kind==='choice') opts=t.options.map((o,i)=>({ label:`${o.icon||''} ${o.t}`, right:i===t.answer }));
    else if(t.kind==='rate') opts=t.items.map(r=>({ label:r.e }));
    else return '';
    const cnt=opts.map(()=>0); let total=0;
    TEAMS.forEach((_,k)=>{ const a=answers[k]; if(!a||a.v==null) return; total++; if(cnt[+a.v]!=null) cnt[+a.v]++; });
    if(!total) return '';
    return opts.map((o,i)=>`<div class="lv-bar ${o.right&&revealed?'right':''}"><span class="lb-t">${o.label}</span>
      <span class="lb-tr"><i style="width:${cnt[i]/total*100}%"></i></span><span class="lb-n">${cnt[i]}</span></div>`).join('');
  }

  function draw(){
    const T=TEAMS, kind=task&&task.kind, graded=GRADED.includes(kind), masked=hide&&!revealed;
    $('.lv-actions').style.display=task?'':'none';
    $('#lvEye').textContent=hide?'🙈':'👁';
    if(!task){
      // شريحة بلا سؤال: نعرض حالة اتصال الأجهزة فقط
      $('#lvQ').innerHTML='👀 لا يوجد سؤال للأجهزة في هذه الشريحة — تعرض الآيبادات «تابعي الشاشة».';
      $('#lvDist').innerHTML='';
      const c=T.filter((_,k)=>presence[k]).length;
      $('#lvCount').textContent=`📱 ${c}/${T.length}`; $('#lvCount').classList.toggle('full',c===T.length);
      $('#lvList').innerHTML=T.map((t,k)=>`<div class="lv-row ${presence[k]?'done':''}" style="--c:${t.color}"><div class="lv-team">
        <span class="lv-dot ${presence[k]?'on':''}"></span><span>${t.icon}</span><b>${t.name}</b><span class="lv-pts">🏆 ${scores[k]}</span><span class="lv-badge">${presence[k]?'📱 متصل':'غير متصل'}</span></div></div>`).join('');
      return;
    }
    $('#lvQ').innerHTML='❓ '+(task.perTeam?'لكل مجموعة مجال مختلف — '+task.q:task.q);
    let n=0, fresh=false;
    const medals={};   // 🥇 ترتيب أسرع المجموعات إجابةً صحيحة
    if(graded&&!masked) fastest().slice(0,3).forEach((k,i)=>medals[k]=['🥇','🥈','🥉'][i]);
    $('#lvList').innerHTML=T.map((t,k)=>{
      const a=answers[k], list=ideas[k]||[];
      const has = kind==='ideas' ? list.length>0 : !!(a&&a.v!=null);
      const sig = kind==='ideas' ? list.length : (has?a.t:0);
      const isNew = primed && has && sig!==lastSig[k];
      lastSig[k]=sig; if(has) n++; if(isNew) fresh=true;
      const g = has&&graded ? LIVE.grade(task,a.v) : null;
      const cls = !has ? '' : (masked||!g) ? 'done' : 'done '+(g.ok===g.total?'ok':g.ok===0?'bad':'part');
      const badge = !has ? '' : (g&&!masked) ? `<span class="lv-badge">${g.total>1?`${g.ok}/${g.total}`:(g.ok?'✓ صحيحة':'✗ خطأ')}</span>`
                  : `<span class="lv-badge">${kind==='ideas'?`💡 ${list.length}`:'✓ أرسلت'}</span>`;
      const ans = !has ? '<div class="lv-ans wait">⏳ بانتظار الإجابة…</div>'
                : masked ? '<div class="lv-ans wait">🙈 مخفية حتى الكشف</div>'
                : `<div class="lv-ans">${ansHTML(kind==='ideas'?list:a.v)}</div>`;
      return `<div class="lv-row ${cls} ${isNew?'new':''}" style="--c:${t.color}"><div class="lv-team">
        <span class="lv-dot ${presence[k]?'on':''}" title="${presence[k]?'الجهاز متصل':'الجهاز غير متصل'}"></span>
        <span>${t.icon}</span><b>${t.name}</b>${medals[k]?`<span class="lv-medal" title="ترتيب السرعة">${medals[k]}</span>`:''}${badge}<button class="lv-plus" data-k="${k}" title="منح نقطة">+1</button></div>${ans}</div>`;
    }).join('');
    const c=$('#lvCount'); c.textContent=`${n}/${T.length}`; c.classList.toggle('full',n===T.length);
    $('#lvDist').innerHTML=masked?'':distHTML();
    const rv=$('#lvReveal'); rv.classList.toggle('on',revealed);
    rv.textContent=revealed?'🔒 تم الكشف على الأجهزة — اضغطي لإعادة الفتح':'🔓 كشف الإجابة على الأجهزة';
    const aw=$('#lvAward'); aw.style.display=graded?'':'none'; aw.disabled=awarded;
    aw.textContent=awarded?'✓ مُنحت النقاط':'🏅 نقاط للإجابات الصحيحة';
    if(fresh) Sound.pop();
    if(n===T.length&&!allDone&&primed){ allDone=true; Sound.success(); toast('🎉 كل المجموعات أجابت!'); }
    if(n<T.length) allDone=false;
  }

  // المجموعات ذات الإجابة الكاملة الصحيحة مرتبة من الأسرع
  function fastest(){
    return TEAMS.map((_,k)=>k).filter(k=>{ const a=answers[k], g=a&&LIVE.grade(task,a.v); return g&&g.ok===g.total; })
      .sort((x,y)=>(answers[x].t||0)-(answers[y].t||0));
  }

  /* ⏱ المؤقت المتزامن مع الأجهزة */
  setInterval(tick,250);
  function tick(){
    $$('.lv-tm').forEach(b=>{ b.classList.remove('run','warn'); b.textContent='⏱ '+b.dataset.sec+' ث'; });
    if(!timer) return;
    const left=Math.ceil((timer.end-LIVE.now())/1000), b=$(`.lv-tm[data-sec="${timer.sec}"]`)||$('#lvT30');
    if(left>0){ b.classList.add('run'); b.classList.toggle('warn',left<=5); b.textContent=`⏸ ${mmss(left)}`; timerEnded=false; }
    else { b.textContent='⏰ انتهى'; if(!timerEnded){ timerEnded=true; Sound.bell(); toast('⏰ انتهى الوقت! الأجهزة مقفلة الآن'); } }
  }
  $$('.lv-tm').forEach(b=>b.onclick=()=>{
    if(!task) return;
    const running=timer&&timer.end>LIVE.now();
    LIVE.ref('timer/'+slide).set(running?null:{ end:LIVE.now()+b.dataset.sec*1000, sec:+b.dataset.sec });
    if(!running) Sound.pop();
  });

  /* أزرار اللوحة */
  $('#liveBtn').onclick=()=>toggle();
  $('#lvHide').onclick=()=>toggle(false);
  $('#lvEye').onclick=()=>{ hide=!hide; save('lv-hide',hide?'1':'0'); draw(); };
  $('#lvList').addEventListener('click',e=>{ const b=e.target.closest('.lv-plus'); if(!b) return; addPoints(+b.dataset.k,1); Sound.success(); });
  $('#lvReveal').onclick=()=>{ if(!task) return; LIVE.ref('reveal/'+slide).set(revealed?null:true); if(!revealed) Sound.success(); };
  $('#lvAward').onclick=()=>{
    const pts=SLIDES[slide].points||LESSON.defaultPoints||1;
    const win=TEAMS.map((_,k)=>k).filter(k=>{ const a=answers[k], g=a&&LIVE.grade(task,a.v); return g&&g.ok===g.total; });
    if(!win.length){ toast('لا توجد إجابات صحيحة كاملة حتى الآن'); Sound.wrong(); return; }
    win.forEach(k=>addPoints(k,pts));
    const first=fastest()[0]; if(first!=null) addPoints(first,1); // ⚡ نقطة إضافية للأسرع
    LIVE.ref('awarded/'+slide).set(true);
    FX.confetti();
    toast(`+${pts} لـ ${win.map(k=>TEAMS[k].icon).join(' ')}${first!=null?` • ⚡ +1 للأسرع ${TEAMS[first].icon}`:''}`, 3500);
  };
  $('#lvClear').onclick=()=>{
    if(!confirm('مسح جميع إجابات المجموعات في هذه الشريحة؟')) return;
    ['answers','ideas','reveal','awarded','timer'].forEach(p=>LIVE.ref(p+'/'+slide).remove()); ideas={}; draw();
  };

  function saveScores(){ if(on) LIVE.ref('scores').set(scores.slice()); }
  function newSession(){
    if(!on) return noLive();
    if(!confirm('بدء حصة جديدة؟\nسيتم مسح كل إجابات المجموعات من الأجهزة وتصفير النقاط.')) return;
    ['answers','ideas','reveal','awarded','timer'].forEach(p=>LIVE.ref(p).remove());
    scores.fill(0); drawScores(); saveScores(); ideas={}; answers={}; seen.clear(); draw(); toast('بدأت حصة جديدة ✓');
  }

  /* 🔐 دخول المعلمة: الرمز يُحفظ على الجهاز، والرقم السري يُطلب في كل مرة */
  function showLogin(msg){
    $('#login').hidden=false; $('#lgErr').textContent=msg||'';
    $('#lgId').value=$('#lgId').value||load('lv-teacher')||'';
    setTimeout(()=>($('#lgId').value?$('#lgPin'):$('#lgId')).focus(),50);
  }
  $('#lgSkip').onclick=()=>{ $('#login').hidden=true; };
  $('#lgForm').onsubmit=async e=>{
    e.preventDefault();
    const id=LIVE.clean($('#lgId').value), pin=$('#lgPin').value.trim(), go=$('#lgGo');
    if(!id) return showLogin('اكتبي رمز المعلمة');
    if(!/^\d{4}$/.test(pin)) return showLogin('الرقم السري 4 أرقام');
    go.disabled=true; $('#lgErr').textContent='';
    try{
      await LIVE.ready;
      if(LIVE.authError) throw { code:'auth' };
      const name=await LIVE.teacherName(id);
      if(!name) throw { code:'noteacher' };
      await LIVE.login(id,pin);
      save('lv-teacher',id); $('#lgPin').value=''; $('#login').hidden=true;
      start(id,name);
    }catch(err){
      showLogin(err.code==='noteacher' ? 'رمز المعلمة غير موجود' : err.code==='auth' ? '⚠️ فعّلي Anonymous في Firebase'
        : /PERMISSION_DENIED/i.test(err.code||err.message||'') ? 'الرقم السري غير صحيح' : 'تعذّر الاتصال، حاولي مرة أخرى');
      $('#lgPin').value=''; $('#lgPin').focus();
    }finally{ go.disabled=false; }
  };
  $('#scOut').onclick=async()=>{
    if(!on) return showLogin();
    if(!confirm('تسجيل خروج المعلمة من هذا الجهاز؟')) return;
    try{ await LIVE.logout(LIVE.room); }catch(e){}
    location.reload();
  };

  /* رمز الفصل + رمز QR على شريحة البداية */
  function showJoin(id){
    const jc=$('#joinCode'); if(!jc) return;
    jc.hidden=false; $('b',jc).textContent=id;
    const url=new URL('student.html?room='+encodeURIComponent(id), location.href).href;
    try{ const q=qrcode(0,'M'); q.addData(url); q.make(); $('.jc-qr',jc).innerHTML=q.createSvgTag({ cellSize:4, margin:0, scalable:true }); }catch(e){}
  }

  /* بعد الدخول: الاتصال + استرجاع النقاط + الأجهزة المتصلة */
  function start(id,name){
    LIVE.setRoom(id); on=true;
    $('#lvRoom').textContent=id;
    showJoin(id);
    $('#liveBtn').style.opacity=''; $('#liveBtn').title='إجابات المجموعات (ج)';
    LIVE.onConn(c=>{ const el=$('#lvConn'); el.classList.toggle('on',c); el.textContent=c?'متصل':'غير متصل'; });
    LIVE.ref('scores').once('value',s=>{ const v=s.val(); if(v){ TEAMS.forEach((_,k)=>scores[k]=Math.max(0,+v[k]||0)); drawScores(); draw(); } });
    LIVE.ref('presence').on('value',s=>{ const v=s.val()||{}; presence={}; Object.keys(v).forEach(k=>presence[k]=!!v[k]); draw(); });
    onSlide(Deck.cur);
    toast(`أهلًا ${esc(name)} 👋 رمز الفصل: ${esc(id)}`, 3500);
  }

  if(LIVE.ok){
    $('#liveBtn').style.opacity=.45; $('#liveBtn').title='سجّلي الدخول لربط أجهزة الطالبات';
    showLogin();
  } else {
    $('#liveBtn').title = LIVE.why==='config' ? 'الربط غير مفعّل: الصقي بيانات Firebase في firebase-config.js' : 'Firebase غير متاح (لا يوجد إنترنت)';
    $('#liveBtn').style.opacity=.45;
  }

  return { onSlide, toggle, saveScores, newSession };
})();

Deck.build();
</script>
</body>
</html>
